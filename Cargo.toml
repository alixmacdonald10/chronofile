[package]
name = "chronofile"
version = "0.3.1"
edition = "2024"
authors = ["A Macdonald"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/alixmacdonald10/chronofile"
description = "A time-travelable file for Rust: a drop-in std::fs::File that keeps compressed full-version snapshots in a companion .chrono file."
categories = ["data-structures", "encoding"]
keywords = ["versioning", "compression", "time-travel", "snapshot", "history"]

[dependencies]
bincode-next = { version = "3.1.1", features = ["serde"] }
crc32fast = "1.5.4"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.29.0", features = ["serde", "v7"] }

[dev-dependencies]
rand = "0.10.3"
tempfile = "3.27.0"
